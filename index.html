<style>
    /* Modern CSS Variables for Easy Customization */
    :root {
        --bg-main: #0B0F19;
        --bg-card: #111827;
        --border-color: #1E293B;
        --text-primary: #FFFFFF;
        --text-secondary: #9CA3AF;
        --text-muted: #D1D5DB;
        --accent-blue: #3B82F6;
        --accent-hover: #2563EB;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* Navigation Bar Header */
    header {
        border-bottom: 1px solid var(--border-color);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1400px;
        margin: 0 auto;
    }

    .logo {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent-blue); }

    nav a {
        margin: 0 20px;
        color: var(--text-secondary);
        font-weight: 500;
        transition: color 0.2s;
    }
    nav a:hover { color: var(--text-primary); }

    .cta-nav {
        background-color: var(--accent-blue);
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.2s;
    }
    .cta-nav:hover { background-color: var(--accent-hover); }

    /* Main Hero Section Profile */
    .hero {
        text-align: center;
        max-width: 850px;
        margin: 100px auto 60px auto;
        padding: 0 20px;
    }

    .hero h1 {
        font-size: 3.5rem;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.03em;
        margin-bottom: 24px;
    }

    .hero p {
        color: var(--text-secondary);
        font-size: 1.25rem;
        margin-bottom: 40px;
    }

    /* High-Conversion Lead Input Bar */
    .lead-form {
        display: flex;
        max-width: 550px;
        margin: 0 auto 50px auto;
        gap: 12px;
    }

    .lead-form input {
        flex: 1;
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 16px 24px;
        border-radius: 8px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 1rem;
    }
    .lead-form input:focus { outline: 1px solid var(--accent-blue); }

    .lead-form button {
        background-color: var(--accent-blue);
        color: white;
        border: none;
        padding: 16px 28px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s;
    }
    .lead-form button:hover { background-color: var(--accent-hover); }

    /* Trust Stats Element Module */
    .stats-bar {
        display: flex;
        justify-content: center;
        gap: 80px;
        margin-bottom: 100px;
    }

    .stat-item h3 { font-size: 2rem; font-weight: 700; }
    .stat-item p { color: var(--text-secondary); font-size: 0.95rem; }

    /* Automated Trending Articles Grid */
    .content-section {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 100px 20px;
    }

    .section-title {
        font-size: 1.5rem;
        margin-bottom: 32px;
        border-left: 4px solid var(--accent-blue);
        padding-left: 12px;
    }

    .articles-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 32px;
    }

    .article-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 32px;
        transition: transform 0.2s, border-color 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .article-card:hover {
        transform: translateY(-4px);
        border-color: var(--accent-blue);
    }

    .tag {
        color: var(--accent-blue);
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
        display: inline-block;
    }

    .article-card h2 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin-bottom: 16px;
    }

    .article-card p {
        color: var(--text-muted);
        font-size: 1rem;
        margin-bottom: 24px;
    }

    .read-time {
        color: var(--text-secondary);
        font-size: 0.85rem;
    }

    /* Responsive Mobile Breaks */
    @media (max-width: 768px) {
        .hero h1 { font-size: 2.5rem; }
        .lead-form { flex-direction: column; }
        .stats-bar { flex-direction: column; gap: 30px; text-align: center; }
    }
</style>
