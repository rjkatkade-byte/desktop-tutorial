<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Enterprises — Omni-Channel Social & AI Web Automation Core</title>
    <!-- High-Performance Typography Matrix (Fixed Domain Link) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Top-Notch Premium Cinematic Global System Tokens */
        :root {
            --bg-deep-space: #030712;
            --bg-panel-glass: rgba(10, 15, 30, 0.75);
            --bg-card: #0F172A;
            --border-glow: rgba(59, 130, 246, 0.15);
            --border-active: #3B82F6;
            --text-white: #FFFFFF;
            --text-dim: #94A3B8;
            
            /* High-Conversion Branding Gradient Channels */
            --gradient-primary: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
            --gradient-meta-fb: linear-gradient(135deg, #1877F2 0%, #0052CC 100%);
            --gradient-meta-ig: linear-gradient(135deg, #F9CE34 0%, #EE2A7B 50%, #6228D7 100%);
            --gradient-ai-engine: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep-space);
            color: var(--text-dim);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            perspective: 1200px; /* Activates global immersive perspective rendering engine */
        }

        h1, h2, h3, h4, .font-cmd {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.02em;
        }

        /* Ambient Cosmic Plasma Energy Nodes */
        .bg-glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            right: -100px;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
        }

        /* Responsive Dashboard Split Wrapper Grid */
        .dashboard-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
        }

        /* 3D Sidebar Console Panel Frame */
        aside.sidebar-console {
            background: var(--bg-panel-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-glow);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-style: preserve-3d;
            transform: translateZ(10px);
        }

        .branding-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-glow);
        }

        .logo-3d-mark {
            position: relative;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--text-white);
            z-index: 1;
        }
        .logo-3d-mark::before {
            content: "";
            position: absolute;
            left: -4px;
            bottom: 4px;
            width: 34px;
            height: 10px;
            background: linear-gradient(135deg, #2563EB, #EC4899);
            transform: rotate(-15deg);
            clip-path: polygon(0% 100%, 100% 0%, 85% 100%, 15% 100%);
            z-index: -1;
        }

        /* Interactive Native Dropdown Configuration Layouts */
        .dropdown-menu-box {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dropdown-menu-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748B;
            font-weight: 700;
        }

        .interactive-select, .interactive-input {
            background-color: #0B0F19;
            border: 1px solid var(--border-glow);
            color: var(--text-white);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .interactive-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
        }
        .interactive-select:focus, .interactive-select:hover, .interactive-input:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
        }

        /* 3D Kinetic Control Feed & Cards Elements */
        main.main-workspace {
            padding: 48px;
            max-width: 1400px;
            width: 100%;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }
        .workspace-header h1 { font-size: 2.5rem; letter-spacing: -0.03em; }

        /* Guide documentation action trigger btn styling */
        .guide-btn {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--border-active);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .guide-btn:hover {
            background-color: var(--border-active);
            color: var(--text-white);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* The Asymmetric Immersive 3D Animated Grid Setup */
        .kinetic-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 48px;
            perspective: 1000px;
        }

        .kinetic-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(30, 41, 59, 0.6) 100%);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 32px;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.1, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        /* Premium Layer Floating Parallax Mechanics */
        .kinetic-card:hover {
            transform: rotateX(12deg) rotateY(-8deg) translateZ(25px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: -15px 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.1);
        }

        .card-icon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            transform: translateZ(30px);
        }

        .platform-icon-pill {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .platform-icon-pill.fb { background: var(--gradient-meta-fb); }
        .platform-icon-pill.ig { background: var(--gradient-meta-ig); }
        .platform-icon-pill.trending { background: var(--gradient-primary); }
        .platform-icon-pill.ai-web { background: var(--gradient-ai-engine); }

        .growth-badge {
            font-size: 0.8rem;
            font-weight: 700;
            color: #10B981;
            background-color: rgba(16, 185, 129, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .kinetic-card h3 { font-size: 1.4rem; margin-bottom: 8px; transform: translateZ(40px); }
        .kinetic-card p { font-size: 0.95rem; line-height: 1.6; transform: translateZ(20px); margin-bottom: 24px; }

        /* Metric Data Readouts */
        .metric-data-row {
            display: flex;
            gap: 24px;
            border-top: 1px solid var(--border-glow);
            padding-top: 20px;
            transform: translateZ(35px);
        }
        .data-node h4 { font-size: 1.5rem; font-weight: 700; color: var(--text-white); }
        .data-node p { font-size: 0.75rem; text-transform: uppercase; color: #64748B; margin-bottom: 0; margin-top: 2px; font-weight: 700; }

        /* Dynamic Trending Post Automation Live Feed Layout */
        .live-stream-feed {
            background-color: var(--bg-panel-glass);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 40px;
            transform-style: preserve-3d;
            transform: translateZ(5px);
            margin-bottom: 48px;
        }
        .feed-header-row {
            display: flex;
            justify-content: space-between;
