<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Enterprises - High-Conversion Automation Platform</title>
    <!-- Optimized Google Fonts Integration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Core Dark Mode Variable Themes */
        :root {
            --bg-main: #0B0F19;
            --bg-card: #111827;
            --border-color: #1E293B;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #D1D5DB;
            --accent-blue: #3B82F6;
            --accent-hover: #2563EB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        /* Premium Sticky Navigation Header Layout */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            perspective: 1000px;
        }

        /* 3D Animated Branding Container */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transform-style: preserve-3d;
            animation: floating3D 4s ease-in-out infinite;
        }

        /* The Animated 3D Custom Logo Mark */
        .logo-mark-3d {
            position: relative;
            width: 42px;
            height: 36px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Duplicating layers for 3D depth */
        .logo-mark-3d::before {
            content: "AR";
            position: absolute;
            top: 0;
            left: 0;
            color: rgba(255, 255, 255, 0.15);
            transform: translateZ(-2px);
            filter: blur(1px);
        }

        .logo-mark-3d::after {
            content: "AR";
            position: absolute;
            top: 0;
            left: 0;
            color: rgba(255, 255, 255, 0.05);
            transform: translateZ(-4px);
        }

        /* The Signature Custom Sharp Blue Slash */
        .blue-slash-3d {
            position: absolute;
            left: -4px;
            bottom: 2px;
            width: 32px;
            height: 12px;
            background: linear-gradient(135deg, #2563EB, #3B82F6);
            transform: translateZ(3px) rotate(-18deg);
            clip-path: polygon(0% 100%, 100% 0%, 85% 100%, 20% 100%);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        /* Company Text */
        .logo-text-3d {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            transform: translateZ(1px);
        }

        /* Interactive Hover Trigger */
        .logo-container:hover {
            animation-play-state: paused;
        }
        .logo-container:hover .logo-mark-3d {
            transform: rotateY(35deg) rotateX(10deg);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 3D Cinematic Animation Timeline */
        @keyframes floating3D {
            0% { transform: translateY(0px) rotateY(-10deg) rotateX(5deg); }
            50% { transform: translateY(-6px) rotateY(15deg) rotateX(-5deg); }
            100% { transform: translateY(0px) rotateY(-10deg) rotateX(5deg); }
        }

        nav a {
            margin: 0 24px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s;
            position: relative;
        }
        nav a:hover { color: var(--text-primary); }
        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--accent-blue);
            transition: width 0.3s;
        }
        nav a:hover::after { width: 100%; }

        .cta-nav {
            background: linear-gradient(90deg, #3B82F6, #9333EA);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .cta-nav:hover { background: var(--accent-hover); }

        /* Main Hero Segment Layout */
        .hero {
            text-align: center;
            max-width: 900px;
            margin: 100px auto 60px auto;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.75rem;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 28px;
            background: linear-gradient(90deg, #3B82F6, #9333EA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.3rem;
            margin-bottom: 44px;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Lead Capture Marketing Form Input */
        .lead-form {
            display: flex;
            max-width: 580px;
            margin: 0 auto 60px auto;
            gap: 14px;
        }
        .lead-form input {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1.05rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .lead-form input:focus { outline: 2px solid var(--accent-blue); }

        .lead-form button {
            background: linear-gradient(90deg, #3B82F6, #9333EA);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.05rem;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(59,130,246,0.4);
        }
        .lead-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59,130,246,0.6);
        }

        /* Statistics Bar Layout */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 100px;
            margin-bottom: 100px;
        }
        .stat-item h3 {
            font-size: 2.25rem;
            font-weight: 700;
            color: white;
            transition: all 0.2s;
        }
        .stat-item:hover h3 {
            transform: scale(1.1);
            color: var(--accent-blue);
        }
        .stat-item p { color: var(--text-secondary); font-size: 1rem; margin-top: 4px; }

        /* Split Layout Core Grid System */
        .main-platform-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 120px 20px;
            display: flex;
            gap: 48px;
        }

        .articles-feed-section { flex: 1; }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 36px;
            color: var(--text-secondary);
            border-left: 4px solid var(--accent-blue);
            padding-left: 14px;
            text-transform: uppercase;
        }

        .articles-stack { display: flex; flex-direction: column; gap: 32px; }

        /* Tutorial Card Layouts */
        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .article-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }

        .tag {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 18px;
            display: inline-block;
        }

        .article-card h2 { font-size: 1.85rem; line-height: 1.3; margin-bottom: 16px; font-weight: 700; }
        .article-card p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 28px; }

        /* Sidebar Widgets Panels */
        .sidebar-panel { width: 360px; flex-shrink: 0; }
        .sidebar-widget {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px;
            position: sticky;
            top: 40px;
        }

        .widget-title {
            font-size: 1.15rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tool-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
