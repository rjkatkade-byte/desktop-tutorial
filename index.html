<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Enterprises — Omni-Channel Social & AI Web Automation Core</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep-space: #030712;
            --bg-panel-glass: rgba(10, 15, 30, 0.75);
            --bg-card: #0F172A;
            --border-glow: rgba(59, 130, 246, 0.15);
            --border-active: #3B82F6;
            --text-white: #FFFFFF;
            --text-dim: #94A3B8;
            --gradient-primary: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
            --gradient-meta-fb: linear-gradient(135deg, #1877F2 0%, #0052CC 100%);
            --gradient-meta-ig: linear-gradient(135deg, #F9CE34 0%, #EE2A7B 50%, #6228D7 100%);
            --gradient-ai-engine: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep-space);
            color: var(--text-dim);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            perspective: 1200px;
        }

        h1, h2, h3, h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.02em;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
            width: 100vw;
        }

        aside.sidebar-console {
            background: var(--bg-panel-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-glow);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .branding-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-glow);
        }

        .logo-3d-mark {
            position: relative;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--text-white);
            z-index: 1;
        }
        .logo-3d-mark::before {
            content: "";
            position: absolute;
            left: -4px;
            bottom: 4px;
            width: 34px;
            height: 10px;
            background: linear-gradient(135deg, #2563EB, #EC4899);
            transform: rotate(-15deg);
            clip-path: polygon(0% 100%, 100% 0%, 85% 100%, 15% 100%);
            z-index: -1;
        }

        .dropdown-menu-box {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dropdown-menu-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748B;
            font-weight: 700;
        }

        .interactive-select, .interactive-input {
            background-color: #0B0F19;
            border: 1px solid var(--border-glow);
            color: var(--text-white);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            width: 100%;
        }
        
        .interactive-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
        }

        main.main-workspace {
            padding: 48px;
            width: 100%;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }
        .workspace-header h1 { font-size: 2.5rem; }

        .guide-btn {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--border-active);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .kinetic-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 48px;
        }

        .kinetic-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(30, 41, 59, 0.6) 100%);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 32px;
            cursor: pointer;
        }

        .card-icon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .platform-icon-pill {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .platform-icon-pill.fb { background: var(--gradient-meta-fb); }
        .platform-icon-pill.ig { background: var(--gradient-meta-ig); }
        .platform-icon-pill.ai-web { background: var(--gradient-ai-engine); }

        .growth-badge {
            font-size: 0.8rem;
            font-weight: 700;
            color: #10B981;
            background-color: rgba(16, 185, 129, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .kinetic-card h3 { font-size: 1.4rem; margin-bottom: 8px; }
        .kinetic-card p { font-size: 0.95rem; margin-bottom: 24px; }

        .metric-data-row {
            display: flex;
            gap: 24px;
            border-top: 1px solid var(--border-glow);
            padding-top: 20px;
        }
        .data-node h4 { font-size: 1.5rem; color: var(--text-white); }
        .data-node p { font-size: 0.75rem; text-transform: uppercase; color: #64748B; margin-top: 2px; font-weight: 700; }

        .live-stream-feed {
            background-color: var(--bg-panel-glass);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 48px;
        }
        .feed-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .feed-table { width: 100%; border-collapse: collapse; text-align: left; }
        .feed-table th { padding: 16px; color: #64748B; font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid var(--border-glow); }
        .feed-table td { padding: 20px 16px; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-white); }
        
        .trending-source-badge { background-color: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; }

        .conversion-monetization-banner {
            background: linear-gradient(135deg, #090E1A 0%, #1E1B4B 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 24px;
            padding: 60px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .banner-info-pane h2 { font-size: 2.4rem; margin-bottom: 16px; background: linear-gradient(90deg, #FFFFFF, #9333EA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .banner-info-pane p { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 32px; }
        .premium-bullet-list { list-style: none; }
        .premium-bullet-list li { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 1rem; color: var(--text-white); }
        .premium-bullet-list li::before { content: "✦"; color: #3B82F6; }

        .pricing-checkout-card { background-color: #070A13; border: 1px solid var(--border-glow); border-radius: 16px; padding: 40px; text-align: center; }
        .price-display-matrix h3 { font-size: 2.8rem; color: var(--text-white); margin-bottom: 4px; }
        .price-display-matrix p { font-size: 0.85rem; color: #64748B; text-transform: uppercase; margin-bottom: 28px; }

        .payment-method-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .pay-tab { background: #111726; border: 1px solid var(--border-glow); border-radius: 8px; padding: 12px; color: var(--text-dim); font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center; }
        .pay-tab.active { background: rgba(59, 130, 246, 0.1); border-color: var(--border-active); color: var(--text-white); }

        .checkout-submit-btn { display: block; width: 100%; background: var(--gradient-primary); color: var(--text-white); border: none; padding: 18px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
